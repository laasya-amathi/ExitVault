version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: exitvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: exitvault
      POSTGRES_USER: exitvault
      POSTGRES_PASSWORD: exitvault
    ports:
      - '5432:5432'
    volumes:
      - exitvault_pgdata:/var/lib/postgresql/data

volumes:
  exitvault_pgdata:
